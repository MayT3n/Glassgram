// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.21"
        // Python runtime for Glassgram plugins
        classpath 'com.chaquo.python:gradle:17.0.0'
    }
}
repositories {
    google()
}

// glassGram: the ABIs the native code is built for and the APKs carry. ARM only: there are next
// to no x86 phones, and each ABI is a full native build. A fast test build
// (-PGLASSGRAM_FAST=true) takes only arm64-v8a and skips R8; CI passes -PGLASSGRAM_CCACHE=true
// to compile the native code through ccache.
ext.glassgramFast = (findProperty("GLASSGRAM_FAST") ?: "false").toString() == "true"
ext.glassgramCcache = (findProperty("GLASSGRAM_CCACHE") ?: "false").toString() == "true"
ext.glassgramArm64 = (findProperty("GLASSGRAM_ARM64") ?: "false").toString() == "true"
ext.glassgramAbis = (ext.glassgramFast || ext.glassgramArm64) ? ["arm64-v8a"] : ["armeabi-v7a", "arm64-v8a"]

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    // AliuHook: Xposed-style method hooks for plugins. Declaring repositories here replaces
    // the ones from settings.gradle, so those are repeated first.
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://maven.aliucord.com/releases'
            content {
                includeGroup 'com.aliucord'
                includeGroup 'com.aliucord.lsplant'
            }
        }
    }

    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
            packaging {
                jniLibs {
                    pickFirsts += ['**/libc++_shared.so']
                }
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}