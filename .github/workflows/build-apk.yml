name: Build APK

on:
  push:
    branches: [ "master", "perf/**" ]
    tags: [ "*" ]
    # The badges list is read by the app at runtime, and the bot and the branding are not in the
    # app: editing them needs no new APK
    paths-ignore:
      - "glassgram-api/**"
      - "glassgram-bot/**"
      - "branding/**"
  pull_request:
    paths-ignore:
      - "glassgram-api/**"
      - "glassgram-bot/**"
      - "branding/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (например v1.0.0). Пусто — без релиза"
        type: string
        default: ""
      variant:
        description: "Что собирать"
        type: choice
        default: release
        options:
          - release
          - debug
          - standalone
          - huawei
      full:
        description: "Полная сборка без релиза (armeabi-v7a и arm64-v8a, с R8)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  # glassGram's tunnel: the pinned XTLS/libXray (Xray-core for mobile), and the Go it builds with
  LIBXRAY_COMMIT: 75ccb623c807a1113a064278e3e544b0049c16a5
  GO_VERSION: 1.27.2
  ANDROID_PLATFORM: android-36

jobs:
  build:
    name: build (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Two editions side by side: the full app, and the RuStore edition without ghost mode, the spy
    # and the in-app updates (GLASSGRAM_STORE)
    strategy:
      fail-fast: false
      matrix:
        edition: [ full, rustore ]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The submodules come from several hosts (chromium.googlesource.com answers 502/503 at
      # times): fetched with retries rather than failing the build on the first error. --force
      # checks every one out: a failed attempt leaves submodules cloned but not checked out, and
      # without it a retry takes them as done and leaves them empty
      - name: Fetch submodules
        run: |
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --depth 1 --jobs 4 --force; then
              exit 0
            fi
            echo "Submodules failed (attempt $attempt), retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages, NDK and CMake
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm ninja-build ccache
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # glassGram's tunnel: Xray-core through XTLS/libXray, bound for Android by gomobile (armv7 and
      # arm64). Built once for each pinned libXray and kept in the cache. Not in the RuStore
      # edition: a build without it has no tunnel
      - name: Restore the Xray library
        id: libxray
        if: matrix.edition == 'full'
        uses: actions/cache/restore@v4
        with:
          path: TMessagesProj/libs/libXray.aar
          key: libxray-${{ env.LIBXRAY_COMMIT }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Go
        if: matrix.edition == 'full' && steps.libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build the Xray library
        if: matrix.edition == 'full' && steps.libxray.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --filter=blob:none https://github.com/XTLS/libXray "$RUNNER_TEMP/libXray"
          cd "$RUNNER_TEMP/libXray"
          git checkout --quiet "$LIBXRAY_COMMIT"
          MOBILE="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go get -tool "golang.org/x/mobile/cmd/gobind@$MOBILE"
          go install "golang.org/x/mobile/cmd/gomobile@$MOBILE"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -target android/arm,android/arm64 -androidapi 21 -trimpath \
            -ldflags="-checklinkname=0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$GITHUB_WORKSPACE/TMessagesProj/libs/libXray.aar" .
          ls -la "$GITHUB_WORKSPACE/TMessagesProj/libs/libXray.aar"

      - name: Save the Xray library
        if: matrix.edition == 'full' && steps.libxray.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TMessagesProj/libs/libXray.aar
          key: libxray-${{ env.LIBXRAY_COMMIT }}-${{ env.ANDROID_NDK_VERSION }}

      # The native code is compiled through ccache, whose cache lives between builds: unchanged
      # C/C++ files are not compiled again. Both editions build the same native code, so both
      # restore the cache and the full edition saves it.
      - name: Restore the native build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.ANDROID_NDK_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ env.ANDROID_NDK_VERSION }}-

      - name: Set up ccache
        run: |
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            # The NDK is installed anew on every run: its version, not the compiler's file
            # times, tells whether cached objects still fit
            echo "CCACHE_COMPILERCHECK=string:${ANDROID_NDK_VERSION}"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache --zero-stats > /dev/null
          ccache --version | head -1

      # Chaquopy (plugins) installs the bundled Python packages with a build Python of the
      # same version as the app's
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Releases are full builds: armeabi-v7a and arm64-v8a, shrunk by R8. Other builds are test
      # builds, much faster: arm64-v8a only and without R8 (GLASSGRAM_FAST)
      - name: Select Gradle task
        id: task
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          FULL: ${{ github.event.inputs.full || 'false' }}
        run: |
          # a branch other than master (the optimization work) builds the debug variant
          VARIANT="${{ github.event.inputs.variant || ((github.ref_type == 'branch' && github.ref_name != 'master') && 'debug') || 'release' }}"
          if [ -n "$RELEASE_TAG" ] || [ "$FULL" = "true" ]; then
            FAST=false
          else
            FAST=true
          fi
          echo "Fast test build: $FAST"
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          case "$VARIANT" in
            release)    TASK=":TMessagesProj_App:assembleAfatRelease";               OUT="TMessagesProj_App/build/outputs/apk" ;;
            debug)      TASK=":TMessagesProj_App:assembleAfatDebug";                 OUT="TMessagesProj_App/build/outputs/apk" ;;
            standalone) TASK=":TMessagesProj_AppStandalone:assembleAfatStandalone";  OUT="TMessagesProj_AppStandalone/build/outputs/apk" ;;
            huawei)     TASK=":TMessagesProj_AppHuawei:assembleAfatRelease";         OUT="TMessagesProj_AppHuawei/build/outputs/apk" ;;
            *) echo "Unknown variant: $VARIANT"; exit 1 ;;
          esac
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      # The Telegram sources ship a public keystore (password "android"): anyone can sign with it,
      # so it is never used. A release needs the key from the repository secrets; any other build
      # is signed with a throwaway key made for this run only (installable, but not an upgrade path)
      - name: Use the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          KS=TMessagesProj/config/release.keystore
          rm -f "$KS"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS"
            keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
            echo "::add-mask::$STORE_PASSWORD"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from the repository secrets"
            exit 0
          fi
          if [ -n "$RELEASE_TAG" ]; then
            echo "::error::A release must be signed with your own persistent key: set the repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS (and RELEASE_KEY_PASSWORD if it differs)."
            exit 1
          fi
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias ci -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Glassgram CI build"
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$PASS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=ci"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          echo "::warning::No signing secrets: signed with a throwaway key made for this run"

      - name: Build APK
        id: build
        env:
          # Telegram API credentials of this fork, from the repository secrets
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          chmod +x gradlew
          # A release knows its own version from its tag, which the app's update check compares
          VERSION_ARG=""
          if [ -n "$RELEASE_TAG" ]; then
            VERSION_ARG="-PGLASSGRAM_VERSION_NAME=${RELEASE_TAG#v}"
          fi
          STORE_ARG=""
          if [ "${{ matrix.edition }}" = "rustore" ]; then
            STORE_ARG="-PGLASSGRAM_STORE=true"
          fi
          FAST_ARG=""
          if [ "${{ steps.task.outputs.fast }}" = "true" ]; then
            FAST_ARG="-PGLASSGRAM_FAST=true"
          fi
          set -o pipefail
          ./gradlew ${{ steps.task.outputs.task }} $VERSION_ARG $STORE_ARG $FAST_ARG -PGLASSGRAM_CCACHE=true \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=4 2>&1 | tee gradle.log

      # The first compile errors of a failed build as annotations, readable without the full log
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          [ -f gradle.log ] || exit 0
          grep -h -A2 -E '^e: |error: |^FAILURE: |What went wrong|Execution failed|Could not (resolve|find)' gradle.log | grep -v '^--$' | head -n 40 | cut -c1-500 | tr -d '\r' | while IFS= read -r line; do echo "::error::$line"; done

      # R8 renames the code of full builds, and their crashes read like j1.x.f(r8-map-id-…:75). The
      # mapping goes to the "mappings" pre-release, named by the map id the traces carry, for
      # glassGram's bot to read crashes back into the source's names (glassgram-bot/retrace.py)
      - name: Publish the R8 mapping
        if: steps.task.outputs.fast == 'false' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p r8-mappings
          find . -path '*/build/outputs/mapping/*/mapping.txt' -not -path './r8-mappings/*' | while read -r file; do
            id=$(sed -n 's/^# pg_map_id: \([0-9a-f]\{7,64\}\)$/\1/p' "$file" | head -1)
            if [ -z "$id" ]; then
              echo "::warning::No map id in $file"
              continue
            fi
            gzip -9 -c "$file" > "r8-mappings/mapping-$id.txt.gz"
          done
          ls -lh r8-mappings
          if ! ls r8-mappings/*.txt.gz > /dev/null 2>&1; then
            echo "::warning::No R8 mapping found"
            exit 0
          fi
          if ! gh release view mappings > /dev/null 2>&1; then
            gh release create mappings --prerelease --target "$GITHUB_SHA" \
              --title "R8 mappings" \
              --notes "R8 mappings of glassGram's full builds, named by the map id in their stack traces (r8-map-id-…). Read by glassGram's bot to make crash reports readable; not an app release." \
              || gh release view mappings > /dev/null
          fi
          gh release upload mappings r8-mappings/*.txt.gz --clobber

      - name: Native build cache stats
        if: always() && steps.build.outcome != 'skipped'
        run: ccache --show-stats || true

      # Unused objects (an ABI only the releases build, old sources) leave after a week
      - name: Trim the native build cache
        if: always() && matrix.edition == 'full' && steps.build.outcome != 'skipped'
        run: ccache --evict-older-than 7d > /dev/null || true

      - name: Save the native build cache
        if: always() && matrix.edition == 'full' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.ANDROID_NDK_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Releases: glassgram-v<version>.apk; other builds: glassgram-<variant>-<commit>.apk
      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_TAG" ]; then
            base="glassgram-v${RELEASE_TAG#v}"
          else
            base="glassgram-${{ steps.task.outputs.variant }}-${GITHUB_SHA::7}"
          fi
          if [ "${{ matrix.edition }}" = "rustore" ]; then
            base="${base}-rustore"
          fi
          count=$(find "${{ steps.task.outputs.out }}" -name '*.apk' | wc -l)
          find "${{ steps.task.outputs.out }}" -name '*.apk' | while read -r apk; do
            flavor_dir="$(basename "$(dirname "$apk")")"
            if [ "$count" -gt 1 ]; then
              cp "$apk" "dist/${base}-${flavor_dir}.apk"
            else
              cp "$apk" "dist/${base}.apk"
            fi
          done
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glassgram-${{ matrix.edition }}-${{ steps.task.outputs.variant }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Artifacts are temporary; every master build is also published as the
      # "latest" pre-release, so the newest APK always has a stable download link.
      - name: Publish APK as the "latest" pre-release
        if: matrix.edition == 'full' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTE=""
          if [ "${{ steps.task.outputs.fast }}" = "true" ]; then
            NOTE=$'\n\nTest build: arm64-v8a only, without R8.'
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "glassGram (latest master build)" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)${NOTE}"

      # The RuStore edition gets its own pre-release with a stable link. It is never attached to
      # the releases: the app's update check (which reads the latest release) would offer it
      - name: Publish the RuStore APK as the "latest-rustore" pre-release
        if: matrix.edition == 'rustore' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTE=""
          if [ "${{ steps.task.outputs.fast }}" = "true" ]; then
            NOTE=$'\n\nTest build: arm64-v8a only, without R8.'
          fi
          gh release delete latest-rustore --yes --cleanup-tag || true
          gh release create latest-rustore dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "glassGram for RuStore (latest master build)" \
            --notes "RuStore edition (no ghost mode, spy or in-app updates), built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)${NOTE}"

      # A pushed tag, or a manual run with release_tag (which creates the tag on this commit)
      - name: Attach APK to GitHub Release
        if: matrix.edition == 'full' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: glassGram ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
